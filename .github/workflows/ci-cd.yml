# Intégration continue + livraison continue (Docker)
#
#  Pull Request  → vérification (lint, tests, TypeScript, build) → image Docker testée et publiée en aperçu (tag pr-<numéro>)
#  Push sur main → vérification → image Docker testée et publiée (tags latest + sha) → déploiement (si configuré)
#
# Rien n'est publié si une étape échoue.
# Images : ghcr.io/<propriétaire>/<dépôt> (GitHub Container Registry, onglet « Packages » du dépôt).

name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Une nouvelle poussée sur la même PR / branche annule l'exécution précédente
concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Vérification (lint, tests, TypeScript, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # Confidentialité des clients, référencement, formulaires, admin, versions, statistiques (tests/)
      - name: Tests automatiques
        run: npm test

      - name: TypeScript + build de production
        run: npm run build

  image:
    name: Image Docker (test + publication)
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Les PR venant d'un fork ne peuvent pas publier d'image : elles sont seulement testées
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Noms et tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: building-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de l'image (démarrage, santé, pages, API, sécurité)
        run: |
          docker run -d --name site -p 8080:8080 -e ADMIN_PASSWORD=motdepasse-de-test building-service:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/services/plans-architecture | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/content | grep -q '"services"'
          curl -fsS http://localhost:8080/sitemap.xml | grep -q '<urlset'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -A 'Mozilla/5.0' -d '{"path":"/","entry":true}' http://localhost:8080/api/stats)" = "204"
          # L'admin refuse l'accès sans mot de passe, et la création d'un mot de passe depuis l'extérieur
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/content)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"password":"x"}' http://localhost:8080/api/admin/auth/login)" = "401"
          docker logs site

      - name: Connexion au registre GitHub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Comment essayer cette version
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Image publiée"
            echo ""
            echo '```bash'
            echo "docker run --rm -p 8080:8080 -e ADMIN_PASSWORD=unmotdepasse $(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
            echo '```'
            echo ""
            echo "Puis ouvrir http://localhost:8080 (admin : http://localhost:8080/admin)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploiement:
    name: Déploiement en production
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      # VPS (deploy/README.md) : secrets VPS_HOST, VPS_USER, VPS_SSH_KEY (et VPS_PORT si différent de 22)
      - name: Mise à jour du VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: cd /opt/building-service && ./update.sh

      # Autres hébergeurs (Render, Coolify, Portainer…) : secret DEPLOY_HOOK_URL
      - name: Déclencher un redéploiement par webhook
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL" && echo "Redéploiement demandé."

      - name: Aucun déploiement configuré
        if: env.VPS_HOST == '' && env.DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice::Aucun serveur configuré (VPS_HOST ou DEPLOY_HOOK_URL) : l'image latest est publiée, mettez le serveur à jour avec deploy/update.sh."
