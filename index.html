<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Le site a sa propre traduction FR / EN : la traduction automatique du navigateur
         (Chrome / Google Traduction) est désactivée pour éviter les doublons et les erreurs,
         comme « Building Service » traduit en « Bâtiment Service ». -->
    <meta name="google" content="notranslate" />

    <meta name="author" content="Building Service" />
    <meta name="theme-color" content="#1f1a17" />

    <!-- Référencement : ce bloc est remplacé page par page par le serveur de production
         (titre, description, aperçu de partage, versions FR/EN, fiche entreprise pour Google).
         Voir shared/seo.js. Les valeurs ci-dessous sont celles de l'accueil. -->
    <!-- SEO:start -->
    <title>Building Service – Construction, rénovation et aménagement au Cameroun</title>
    <meta name="description" content="Plans d’architecture, construction, rénovation, finitions et aménagement intérieur à Yaoundé et Douala. Un seul interlocuteur, du plan à la remise des clés. Devis gratuit." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Building Service" />
    <meta property="og:title" content="Building Service – Construction, rénovation et aménagement au Cameroun" />
    <meta property="og:description" content="Du plan d’architecte à la remise des clés : construction, rénovation et aménagement au Cameroun." />
    <meta property="og:image" content="/images/carousel.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- SEO:end -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
