# Nginx → site Building Service (conteneur Docker sur 127.0.0.1:8080)
# Modèle : install-nginx.sh remplace __SERVER_NAMES__ et l'installe dans /etc/nginx/sites-available/.
# Certbot y ajoute ensuite le HTTPS (port 443) et la redirection http → https.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # Envoi de photos et vidéos depuis l'admin (MAX_UPLOAD_MB, 300 Mo par défaut)
    client_max_body_size 300m;
    proxy_request_buffering off;

    # Grosses vidéos : le serveur du site accepte jusqu'à 10 minutes par envoi
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Le site lit la PREMIÈRE adresse de X-Forwarded-For (anti-abus des formulaires, statistiques) :
        # on la remplace par l'adresse réelle au lieu d'ajouter à celle envoyée par le visiteur.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
